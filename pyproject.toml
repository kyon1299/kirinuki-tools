[project]
name = "kirinuki-tools"
version = "0.1.0"
description = "VTuber配信アーカイブから切り抜きの下書きを作るツール"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "faster-whisper>=1.1",
    "anthropic",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
kirinuki = "kirinuki.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kirinuki"]
